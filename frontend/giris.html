<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş · Yemekhane</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="stylesheet" href="/css/uygulama.css">
</head>
<body>
  <main class="giris-sayfa">
    <section class="kart giris-kart">
      <div class="marka"><span class="marka-isaret">Y</span>Yemekhane</div>
      <p class="soluk">Kampüs e-postanız ve şifrenizle giriş yapın.</p>
      <h1>Giriş yap</h1>
      <p id="bildirim" hidden></p>
      <form id="giris-formu" novalidate>
        <div class="form-alan">
          <label for="eposta">E-posta</label>
          <input id="eposta" name="eposta" type="email" autocomplete="username" placeholder="ad.soyad@kampus.edu.tr" required>
        </div>
        <div class="form-alan">
          <label for="sifre">Şifre</label>
          <input id="sifre" name="sifre" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="dugme tam-genislik">Giriş yap</button>
      </form>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById('giris-formu');
    const bildirim = document.getElementById('bildirim');
    const parametreler = new URLSearchParams(location.search);

    if (tokenAl()) location.href = '/';
    if (parametreler.get('sure') === 'doldu') bildirimGoster(bildirim, 'Oturumunuzun süresi doldu, lütfen tekrar giriş yapın.');
    if (parametreler.has('cikis')) bildirimGoster(bildirim, 'Çıkış yaptınız.', 'basari');

    form.addEventListener('submit', async (olay) => {
      olay.preventDefault();
      bildirimGizle(bildirim);
      await dugmeKilitle(form.querySelector('button'), async () => {
        try {
          const sonuc = await api('/auth/giris', { method: 'POST', govde: { eposta: form.eposta.value, sifre: form.sifre.value } });
          tokenKaydet(sonuc.token);
          location.href = '/';
        } catch (hata) {
          bildirimGoster(bildirim, hata.message);
          form.sifre.select();
        }
      });
    });
  </script>
</body>
</html>
