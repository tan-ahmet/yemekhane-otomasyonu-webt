<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Günün Menüsü · Yemekhane</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="stylesheet" href="/css/uygulama.css">
</head>
<body>
  <main class="kapsayici sayfa">
    <div class="sayfa-baslik">
      <h1>Günün Menüsü</h1>
      <span id="tarih-yazisi" class="soluk"></span>
    </div>

    <section class="kart secim-satiri">
      <div class="form-alan">
        <label for="yemekhane">Yemekhane</label>
        <select id="yemekhane"></select>
      </div>
      <div class="form-alan">
        <label for="ogun">Öğün</label>
        <select id="ogun"></select>
      </div>
      <div class="form-alan">
        <label for="tarih">Tarih</label>
        <input id="tarih" type="date">
      </div>
    </section>

    <p id="bildirim" hidden></p>

    <section id="menu-alani" class="kart" hidden>
      <h2 id="menu-baslik"></h2>
      <div class="menu-ozet">
        <div><span>Ücretiniz</span><strong id="fiyat"></strong></div>
        <div><span>Toplam kalori</span><strong id="kalori"></strong></div>
        <div><span>Rezervasyon son</span><strong id="son-saat"></strong></div>
      </div>
      <ul id="yemek-listesi" class="yemek-listesi"></ul>
      <p id="vejetaryen-bilgi" class="soluk"></p>
    </section>

    <p id="menu-yok" class="kart bos" hidden>Bu yemekhanede seçilen gün ve öğün için menü bulunmuyor.</p>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    async function baslat() {
      try {
        await oturumGerekli();
        const secenekler = await api('/menu/secenekler');
        secenekleriDoldur($('yemekhane'), secenekler.yemekhaneler);
        secenekleriDoldur($('ogun'), secenekler.ogunler);
        $('ogun').value = '2';
        $('tarih').value = secenekler.bugun;
        for (const id of ['yemekhane', 'ogun', 'tarih']) $(id).addEventListener('change', menuyuYukle);
        await menuyuYukle();
      } catch (hata) {
        bildirimGoster($('bildirim'), hata.message);
      }
    }

    async function menuyuYukle() {
      bildirimGizle($('bildirim'));
      $('menu-alani').hidden = true;
      $('menu-yok').hidden = true;
      $('tarih-yazisi').textContent = $('tarih').value ? tarihYaz($('tarih').value) : '';
      try {
        const q = new URLSearchParams({ yemekhane: $('yemekhane').value, ogun: $('ogun').value, tarih: $('tarih').value });
        const yanit = await api('/menu/gunun?' + q);
        if (!yanit.menu) {
          $('menu-yok').hidden = false;
          return;
        }
        menuyuCiz(yanit.menu);
      } catch (hata) {
        bildirimGoster($('bildirim'), hata.message);
      }
    }

    function menuyuCiz(menu) {
      $('menu-baslik').textContent = `${menu.yemekhane} · ${menu.ogun}`;
      $('fiyat').textContent = tl(menu.fiyat);
      $('kalori').textContent = menu.toplam_kalori + ' kcal';
      $('son-saat').textContent = saatYaz(menu.rezervasyon_son);
      $('vejetaryen-bilgi').textContent = menu.tumu_vejetaryen ? 'Menünün tamamı vejetaryen.' : 'Menüde vejetaryen olmayan yemek var.';
      $('yemek-listesi').replaceChildren(...menu.yemekler.map(yemekOgesi));
      $('menu-alani').hidden = false;
    }

    function yemekOgesi(yemek) {
      return el(
        'li',
        { sinif: 'yemek' },
        el('div', { sinif: 'yemek-ust' }, el('span', { metin: yemek.kategori }), el('span', { metin: yemek.kalori + ' kcal' })),
        el('div', { sinif: 'yemek-ad', metin: yemek.ad }),
        el(
          'div',
          { sinif: 'rozetler' },
          yemek.vejetaryen ? el('span', { sinif: 'rozet rozet-yesil', metin: 'Vejetaryen' }) : null,
          yemek.alerjenler.map((a) => el('span', { sinif: 'rozet rozet-sari', metin: a })),
        ),
      );
    }

    baslat();
  </script>
</body>
</html>
