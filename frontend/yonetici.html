<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yönetici Paneli · Yemekhane</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="stylesheet" href="/css/uygulama.css">
</head>
<body>
  <main class="kapsayici sayfa">
    <div class="sayfa-baslik">
      <h1>Yönetici Paneli</h1>
      <button class="dugme dugme-kucuk" type="button" id="yeni-menu">+ Yeni menü</button>
    </div>
    <p id="bildirim" hidden></p>

    <section class="kart" id="form-kart" hidden>
      <h2 id="form-baslik">Yeni menü</h2>
      <form id="menu-formu" novalidate>
        <div class="izgara izgara-3">
          <div class="form-alan">
            <label for="f-yemekhane">Yemekhane</label>
            <select id="f-yemekhane"></select>
          </div>
          <div class="form-alan">
            <label for="f-tarih">Tarih</label>
            <input id="f-tarih" type="date">
          </div>
          <div class="form-alan">
            <label for="f-ogun">Öğün</label>
            <select id="f-ogun"></select>
          </div>
          <div class="form-alan">
            <label for="f-ogrenci">Öğrenci fiyatı (TL)</label>
            <input id="f-ogrenci" type="number" step="0.01" min="0" inputmode="decimal">
          </div>
          <div class="form-alan">
            <label for="f-personel">Personel fiyatı (TL)</label>
            <input id="f-personel" type="number" step="0.01" min="0" inputmode="decimal">
          </div>
        </div>
        <div class="form-alan">
          <label>Yemekler <span class="soluk" id="secili-sayi"></span></label>
          <div class="yemek-secim" id="yemek-secim"></div>
        </div>
        <div class="dugme-satiri">
          <button class="dugme" type="submit">Kaydet</button>
          <button class="dugme dugme-ikincil" type="button" id="vazgec">Vazgeç</button>
        </div>
      </form>
    </section>

    <section class="kart">
      <h2>Menü bazında doluluk ve ortalama puan</h2>
      <div class="secim-satiri">
        <div class="form-alan">
          <label for="r-yemekhane">Yemekhane</label>
          <select id="r-yemekhane"></select>
        </div>
        <div class="form-alan">
          <label for="r-baslangic">Başlangıç</label>
          <input id="r-baslangic" type="date">
        </div>
        <div class="form-alan">
          <label for="r-bitis">Bitiş</label>
          <input id="r-bitis" type="date">
        </div>
      </div>
      <div class="tablo-kaydir" style="margin-top:1rem">
        <table class="tablo">
          <thead>
            <tr>
              <th>Tarih</th><th>Yemekhane</th><th>Öğün</th><th class="sayi">Rezerve</th><th>Doluluk</th>
              <th class="sayi">Boş</th><th class="sayi">Puan</th><th class="sayi">Oy</th><th class="sayi">Öğr. / Pers.</th><th></th>
            </tr>
          </thead>
          <tbody id="rapor"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let duzenlenen = null;
    let bugun = '';

    async function baslat() {
      try {
        await oturumGerekli('yonetici');
        const [secenekler, yemekler] = await Promise.all([api('/menu/secenekler'), api('/yonetim/yemekler')]);
        bugun = secenekler.bugun;
        secenekleriDoldur($('f-yemekhane'), secenekler.yemekhaneler);
        secenekleriDoldur($('f-ogun'), secenekler.ogunler);
        secenekleriDoldur($('r-yemekhane'), [{ id: '', ad: 'Tümü' }, ...secenekler.yemekhaneler]);
        yemekSeciminiCiz(yemekler);
        $('r-baslangic').value = gunEkle(bugun, -3);
        $('r-bitis').value = gunEkle(bugun, 3);
        for (const id of ['r-yemekhane', 'r-baslangic', 'r-bitis']) $(id).addEventListener('change', raporuYukle);
        $('yeni-menu').addEventListener('click', () => formuAc(null));
        $('vazgec').addEventListener('click', () => ($('form-kart').hidden = true));
        $('menu-formu').addEventListener('submit', kaydet);
        await raporuYukle();
      } catch (hata) {
        bildirimGoster($('bildirim'), hata.message);
      }
    }

    function gunEkle(tarih, gun) {
      const t = new Date(tarih + 'T12:00:00');
      t.setDate(t.getDate() + gun);
      return t.toISOString().slice(0, 10);
    }

    function yemekSeciminiCiz(yemekler) {
      const gruplar = new Map();
      for (const y of yemekler) gruplar.set(y.kategori, [...(gruplar.get(y.kategori) ?? []), y]);
      $('yemek-secim').replaceChildren(
        ...[...gruplar].map(([kategori, liste]) =>
          el(
            'fieldset',
            {},
            el('legend', { metin: kategori }),
            liste.map((y) =>
              el('label', { sinif: 'onay' }, el('input', { type: 'checkbox', name: 'yemek', value: y.id }), y.ad, el('span', { sinif: 'soluk', metin: `${y.kalori} kcal${y.vejetaryen ? ' · V' : ''}` })),
            ),
          ),
        ),
      );
      $('yemek-secim').addEventListener('change', seciliSay);
    }

    function seciliSay() {
      $('secili-sayi').textContent = `(${document.querySelectorAll('[name=yemek]:checked').length} seçili)`;
    }

    async function formuAc(menuId) {
      bildirimGizle($('bildirim'));
      $('menu-formu').reset();
      duzenlenen = menuId;
      for (const id of ['f-yemekhane', 'f-tarih', 'f-ogun']) $(id).disabled = menuId !== null;
      if (menuId) {
        const m = await api('/yonetim/menuler/' + menuId);
        $('form-baslik').textContent = `Menü #${m.id} düzenle`;
        $('f-yemekhane').value = m.yemekhane_id;
        $('f-tarih').value = m.tarih;
        $('f-ogun').value = m.ogun_id;
        $('f-ogrenci').value = m.ogrenci_fiyati;
        $('f-personel').value = m.personel_fiyati;
        for (const k of document.querySelectorAll('[name=yemek]')) k.checked = m.yemek_idleri.includes(Number(k.value));
      } else {
        $('form-baslik').textContent = 'Yeni menü';
        $('f-tarih').value = gunEkle(bugun, 7);
      }
      seciliSay();
      $('form-kart').hidden = false;
      const ilk = document.querySelector('[name=yemek]:checked')?.closest('fieldset');
      $('yemek-secim').scrollTop = ilk ? ilk.offsetTop - $('yemek-secim').offsetTop : 0;
      $('form-kart').scrollIntoView();
    }

    async function kaydet(olay) {
      olay.preventDefault();
      const govde = {
        ogrenci_fiyati: Number($('f-ogrenci').value),
        personel_fiyati: Number($('f-personel').value),
        yemek_idleri: [...document.querySelectorAll('[name=yemek]:checked')].map((k) => Number(k.value)),
      };
      if (!duzenlenen) Object.assign(govde, { yemekhane_id: Number($('f-yemekhane').value), tarih: $('f-tarih').value, ogun_id: Number($('f-ogun').value) });
      await dugmeKilitle($('menu-formu').querySelector('[type=submit]'), async () => {
        try {
          const sonuc = duzenlenen
            ? await api('/yonetim/menuler/' + duzenlenen, { method: 'PUT', govde })
            : await api('/yonetim/menuler', { method: 'POST', govde });
          $('form-kart').hidden = true;
          bildirimGoster($('bildirim'), `${sonuc.mesaj} (Menü #${sonuc.menu_id})`, 'basari');
          await raporuYukle();
        } catch (hata) {
          bildirimGoster($('bildirim'), hata.message);
        }
      });
    }

    async function raporuYukle() {
      try {
        const q = new URLSearchParams({ baslangic: $('r-baslangic').value, bitis: $('r-bitis').value });
        if ($('r-yemekhane').value) q.set('yemekhane', $('r-yemekhane').value);
        const rapor = await api('/yonetim/menuler?' + q);
        $('rapor').replaceChildren(
          ...(rapor.menuler.length ? rapor.menuler.map(raporSatiri) : [el('tr', {}, el('td', { colSpan: 10, sinif: 'bos', metin: 'Bu aralıkta menü yok.' }))]),
        );
      } catch (hata) {
        bildirimGoster($('bildirim'), hata.message);
      }
    }

    function raporSatiri(m) {
      const duzenle = el('button', { type: 'button', sinif: 'dugme dugme-ikincil dugme-kucuk', metin: 'Düzenle' });
      duzenle.addEventListener('click', () => formuAc(m.menu_id));
      const cubuk = el('span', { sinif: 'doluluk-cubuk' }, el('span', { style: `width:${Math.min(100, m.doluluk_yuzde)}%` }));
      return el(
        'tr',
        { 'data-menu': m.menu_id },
        el('td', { metin: kisaTarihYaz(m.tarih) }),
        el('td', { metin: m.yemekhane }),
        el('td', { metin: m.ogun }),
        el('td', { sinif: 'sayi', metin: `${m.rezerve} / ${m.kapasite}` }),
        el('td', {}, cubuk, '%' + m.doluluk_yuzde),
        el('td', { sinif: 'sayi', metin: m.bos_yer }),
        el('td', { sinif: 'sayi', metin: m.ortalama_puan ?? '—' }),
        el('td', { sinif: 'sayi', metin: m.oy_sayisi }),
        el('td', { sinif: 'sayi', metin: `${tl(m.ogrenci_fiyati)} / ${tl(m.personel_fiyati)}` }),
        el('td', {}, duzenle),
      );
    }

    baslat();
  </script>
</body>
</html>
